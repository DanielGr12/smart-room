[env:esp32-c3-supermini]
; The official "espressif32" platform is stuck on arduino-esp32 core 2.0.17.
; HomeSpan needs core 3.3.0+, so this uses the community-maintained
; pioarduino fork instead, which tracks current arduino-esp32 releases.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino

; Single large app partition (no OTA slot) -- we deliberately never
; enable OTA, and HomeSpan + WiFi don't fit in the default dual-OTA
; partition layout.
board_build.partitions = huge_app.csv

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
upload_port = /dev/cu.usbmodem1113401
monitor_port = /dev/cu.usbmodem1113401

lib_deps =
    sui77/rc-switch @ ^2.6.4
    homespan/HomeSpan
